<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>conduits.xyz widget — rsvp</title>
    <link href="../conduit-url-input.css" rel="stylesheet" />
    <!-- In <head>, not down by the widget's own <script> — see
         xyz-waitlist/index.html's identical comment for why. -->
    <link href="./style.css" rel="stylesheet" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        margin-bottom: 1.5rem;
      }
      .demo-card {
        padding: 1.25rem;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>RSVP widget</h1>
    <p>Paste a conduit's own ID (the part your dashboard card shows) below
      to try it — a real embed hardcodes a full conduit URL in its own
      copy of the tag instead.</p>
    <div class="field">
      <label for="curi-input">Conduit URL</label>
      <div class="conduit-url-control">
        <span id="curi-prefix" class="conduit-url-prefix"></span>
        <input id="curi-input" type="text" autocomplete="off" spellcheck="false" placeholder="L3-5bDHXD9EJ" />
      </div>
      <div id="curi-status" class="conduit-url-status" role="status" aria-live="polite"></div>
    </div>

    <div class="demo-card">
      <!-- caption: the widget renders its own label and wires it to
           the form itself (aria-labelledby) — see packages/widgets/README.md's
           "Semantic markup" section. -->
      <xyz-rsvp id="rsvp" caption="RSVP for our launch party"></xyz-rsvp>
    </div>

    <script src="./xyz-rsvp.js"></script>
    <script src="../conduit-url-input.js"></script>
    <script type="module">
      setupConduitUrlInput({
        inputId: 'curi-input',
        prefixId: 'curi-prefix',
        statusId: 'curi-status',
        storageKey: 'rsvp',
        onChange(url) {
          // conduit-url is only read once, in connectedCallback, so
          // re-configuring means recreating the element.
          const fresh = document.createElement('xyz-rsvp')
          fresh.id = 'rsvp'
          fresh.setAttribute('caption', 'RSVP for our launch party')
          if (url) fresh.setAttribute('conduit-url', url)
          document.getElementById('rsvp').replaceWith(fresh)
        },
      })
    </script>
  </body>
</html>
