<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>conduits.xyz widget — plain form</title>
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <!--
      Baseline widget: a plain HTML form that POSTs directly to the
      conduit URL, no JavaScript required for it to work. The gallery
      demo (../index.html) wires the action up via postMessage so this
      one page can be pointed at any conduit; a real embed simply hardcodes
      its own conduit's URL as the form's action instead.

      A native form submission sends application/x-www-form-urlencoded,
      not JSON — the gateway accepts that directly, treating a bare field
      name like "name" as that field under `fields`.
    -->
    <form id="widget-form" class="xyz-form" method="post">
      <!-- h3, not h1/h2, and deliberately so even though nothing on this
           page ranks above it: a real embed drops this widget into the
           middle of someone else's page, which already has its own
           heading structure — this widget shouldn't assume it owns the
           top of it. Opened standalone (as this file's own demo/test
           usage does), there's simply no heading above it; that's an
           accepted trade-off, not an oversight. -->
      <h3>Contact us</h3>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <button type="submit" id="submit-button">Submit</button>
      <p class="status" data-state="idle" role="status" aria-live="polite"></p>
    </form>
    <script type="module">
      const form = document.getElementById('widget-form')
      const submitButton = document.getElementById('submit-button')
      const status = form.querySelector('.status')

      function setConduitUrl(url) {
        if (url) {
          form.action = url
          submitButton.disabled = false
          status.textContent = ''
        } else {
          submitButton.disabled = true
          status.textContent = 'Not connected to a conduit yet.'
        }
      }

      // A real embed sets `action` directly in its own copy of this
      // HTML; this file's own copy never does, relying on postMessage
      // from the gallery/demo page instead — so this only applies when
      // no static action was actually given.
      if (!form.getAttribute('action')) {
        setConduitUrl(null)
        window.addEventListener('message', (event) => setConduitUrl(event.data))
      }

      // Without this, a submit with no real action would navigate to
      // this page's own URL instead.
      form.addEventListener('submit', (event) => {
        if (!form.getAttribute('action')) {
          event.preventDefault()
          status.textContent = 'Not connected to a conduit yet.'
        }
      })
    </script>
  </body>
</html>
